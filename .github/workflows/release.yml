name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# NOTE: macOS .pkg is NOT built in CI. The GitHub macos-14 runner cannot
# sign installer packages — both productbuild --sign and pkgbuild --sign
# hang indefinitely on every signing attempt (verified across multiple
# runs / multiple tool variations / multiple keychain configurations).
# The signed + notarized .pkg is built locally on a developer Mac via
# scripts/release-macos.sh and uploaded to the Release page after the
# Linux/Windows artifacts are published. See docs/BUILDING.md.

jobs:
  build-linux:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: native-host/go.sum

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build .deb / .rpm / .tar.gz
        run: ./scripts/build-linux.sh "${{ steps.version.outputs.version }}" "${{ matrix.arch }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/linux-${{ matrix.arch }}/*.deb
            dist/linux-${{ matrix.arch }}/*.rpm
            dist/linux-${{ matrix.arch }}/*.tar.gz

  build-windows:
    name: Build Windows .zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: native-host/go.sum

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build .zip
        run: ./scripts/build-windows.sh "${{ steps.version.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/windows/*.zip

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate SHA256 sums
        run: |
          cd artifacts
          find . -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | xargs -0 shasum -a 256 \
            | sed 's|./[^/]*/||' \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Move all artifacts to one dir
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          cp artifacts/SHA256SUMS.txt release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
          body: |
            ## Installation

            **macOS:** the signed `.pkg` is uploaded manually a few minutes after this release is published. If it's not visible yet, please check back shortly.

            **Linux / Windows:** see assets below.

            See the [README](https://github.com/FrancisGregori/audio-tab-finder#installation) for detailed install instructions per platform.
